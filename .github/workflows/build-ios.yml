name: Build iOS App (Bypass Shared Projects)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      # 为所有项目创建空的资产文件（但包含必要的结构）
      - name: 创建所有项目的资产文件
        run: |
          # 使用 Python 生成一个最小的但结构完整的 asset 文件
          python3 << 'EOF'
          import json
          import os

          # 基础资产文件结构（包含所有必需字段）
          base_asset = {
              "version": 3,
              "targets": {
                  "net10.0": {}
              },
              "libraries": {},
              "projectFileDependencyGroups": {
                  "net10.0": []
              },
              "packageFolders": {
                  "/Users/runner/.nuget/packages/": {}
              },
              "project": {
                  "restore": {
                      "projectUniqueName": "dummy.csproj",
                      "projectName": "dummy",
                      "projectPath": "dummy.csproj",
                      "packagesPath": "/Users/runner/.nuget/packages/",
                      "outputPath": "obj/",
                      "projectStyle": "PackageReference",
                      "originalTargetFrameworks": ["net10.0"]
                  }
              }
          }

          # 为共享项目创建资产文件
          for proj in ["OpenUtau.Core", "OpenUtau.Plugin.Builtin", "OpenUtauMobile.Plugin.Renderers"]:
              os.makedirs(f"{proj}/obj", exist_ok=True)
              with open(f"{proj}/obj/project.assets.json", "w") as f:
                  json.dump(base_asset, f, indent=2)
              print(f"✅ 创建 {proj}/obj/project.assets.json")

          # 为主项目创建资产文件（使用 net10.0-ios 目标）
          ios_asset = base_asset.copy()
          ios_asset["targets"] = {"net10.0-ios": {}}
          ios_asset["projectFileDependencyGroups"] = {"net10.0-ios": []}
          ios_asset["project"]["restore"]["originalTargetFrameworks"] = ["net10.0-ios"]
          
          os.makedirs("OpenUtauMobile/obj", exist_ok=True)
          with open("OpenUtauMobile/obj/project.assets.json", "w") as f:
              json.dump(ios_asset, f, indent=2)
          print("✅ 创建 OpenUtauMobile/obj/project.assets.json")
          EOF

      # 尝试只编译主项目，使用 --no-dependencies 跳过共享项目
      - name: 编译 iOS 主项目（跳过依赖）
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            --no-dependencies \
            --no-restore \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:TargetFrameworks=net10.0-ios \
            -p:DisableImplicitFrameworkReferences=true \
            -p:GenerateErrorForMissingTargetingPacks=false

      - name: 检查是否生成了 .app
        run: |
          find . -name "*.app" -type d 2>/dev/null || echo "未找到 .app"

      - name: 如果找到 .app 则打包
        if: success()
        run: |
          APP_PATH=$(find . -name "*.app" -type d -path "*/net10.0-ios/*" -print -quit 2>/dev/null || echo "")
          if [ -n "$APP_PATH" ]; then
            echo "找到 .app: $APP_PATH"
            cd $(dirname "$APP_PATH")
            mkdir -p Payload
            mv $(basename "$APP_PATH") Payload/
            zip -r OpenUtauMobile.ipa Payload/
          else
            echo "未找到 .app 文件，编译可能失败"
            exit 1
          fi

      - name: 上传 .ipa 到 Actions 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
