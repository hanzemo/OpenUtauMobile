name: Build iOS App (Manual Assets)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      - name: 还原项目依赖
        run: dotnet restore OpenUtauMobile.sln -p:TargetFrameworks=net10.0-ios --runtime ios-arm64

      # ========== 关键步骤：手动创建缺失的 asset 文件 ==========
      - name: 手动创建 project.assets.json 文件
        run: |
          # 定义 JSON 内容（一个最简但结构完整的资产文件）
          ASSET_JSON='{
            "version": 3,
            "targets": {
              "net10.0": {}
            },
            "libraries": {},
            "projectFileDependencyGroups": {
              "net10.0": []
            },
            "packageFolders": {},
            "project": {
              "restore": {
                "projectUniqueName": "dummy.csproj",
                "projectName": "dummy",
                "projectPath": "dummy.csproj",
                "packagesPath": "/Users/runner/.nuget/packages/",
                "outputPath": "obj/",
                "projectStyle": "PackageReference",
                "originalTargetFrameworks": ["net10.0"]
              }
            }
          }'

          # 为 OpenUtau.Core 创建
          mkdir -p OpenUtau.Core/obj
          echo "$ASSET_JSON" > OpenUtau.Core/obj/project.assets.json

          # 为 OpenUtau.Plugin.Builtin 创建
          mkdir -p OpenUtau.Plugin.Builtin/obj
          echo "$ASSET_JSON" > OpenUtau.Plugin.Builtin/obj/project.assets.json

          # 为 OpenUtauMobile.Plugin.Renderers 创建
          mkdir -p OpenUtauMobile.Plugin.Renderers/obj
          echo "$ASSET_JSON" > OpenUtauMobile.Plugin.Renderers/obj/project.assets.json

          echo "✅ 手动创建的 project.assets.json 文件已就位"
      # =====================================================

      - name: 编译生成未签名的 .app 包
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:TargetFrameworks=net10.0-ios

      - name: 手动打包为 .ipa (兼容 TrollStore Lite)
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir Payload
          mv OpenUtauMobile.app Payload/
          zip -r OpenUtauMobile.ipa Payload/

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
