name: Build iOS App (Pure Restore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 iOS 工作负载
        run: dotnet workload install ios

      - name: 还原所有项目依赖
        run: |
          echo "📦 还原 OpenUtau.Core..."
          dotnet restore OpenUtau.Core/OpenUtau.Core.csproj --force
          
          echo "📦 还原 OpenUtau.Plugin.Builtin..."
          dotnet restore OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj --force
          
          echo "📦 还原 OpenUtauMobile.Plugin.Renderers..."
          dotnet restore OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj --force
          
          echo "📦 还原 OpenUtauMobile (主项目)..."
          dotnet restore OpenUtauMobile/OpenUtauMobile.csproj \
            -p:TargetFrameworks=net10.0-ios \
            --runtime ios-arm64 \
            --force

      - name: 验证资产文件
        run: |
          echo "📋 验证资产文件..."
          for proj in OpenUtau.Core OpenUtau.Plugin.Builtin OpenUtauMobile.Plugin.Renderers OpenUtauMobile; do
            if [ -f "$proj/obj/project.assets.json" ]; then
              echo "  ✅ $proj/obj/project.assets.json 存在"
            else
              echo "  ❌ $proj/obj/project.assets.json 不存在"
            fi
          done

      - name: 编译共享项目
        run: |
          dotnet build OpenUtau.Core/OpenUtau.Core.csproj -c Debug --no-restore
          dotnet build OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj -c Debug --no-restore
          dotnet build OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj -c Debug --no-restore

      - name: 编译 iOS 主项目
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            --no-restore

      - name: 打包 .ipa
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir -p Payload
          mv OpenUtauMobile.app Payload/ 2>/dev/null || echo "未找到 .app"
          zip -r OpenUtauMobile.ipa Payload/ 2>/dev/null || echo "打包失败"

      - name: 上传 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
