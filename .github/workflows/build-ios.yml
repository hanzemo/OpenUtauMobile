name: Build iOS App (Build Handles Restore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 iOS 工作负载
        run: dotnet workload install ios

      # 直接编译共享项目，让 dotnet build 自己处理还原
      - name: 编译共享项目（自动还原）
        run: |
          dotnet build OpenUtau.Core/OpenUtau.Core.csproj \
            -f net10.0 \
            -c Debug \
            -p:RestorePackages=true \
            -p:RestoreForce=true

          dotnet build OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj \
            -f net10.0 \
            -c Debug \
            -p:RestorePackages=true \
            -p:RestoreForce=true

          dotnet build OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj \
            -f net10.0 \
            -c Debug \
            -p:RestorePackages=true \
            -p:RestoreForce=true

      - name: 编译 iOS 主项目（自动还原）
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:RestorePackages=true \
            -p:RestoreForce=true

      - name: 打包 .ipa
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir -p Payload
          mv OpenUtauMobile.app Payload/ 2>/dev/null || echo "未找到 .app"
          zip -r OpenUtauMobile.ipa Payload/ 2>/dev/null || echo "打包失败"

      - name: 上传 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
