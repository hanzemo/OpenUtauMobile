name: Build iOS App (Let Restore Do Its Job)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      # 关键修改：只还原主项目，让它自己生成正确的资产文件
      - name: 还原主项目（让 dotnet 自己处理）
        run: |
          dotnet restore OpenUtauMobile/OpenUtauMobile.csproj \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifiers=ios-arm64 \
            --runtime ios-arm64

      # 共享项目仍然手动创建（或者也可以尝试还原，但可能触发 Android 问题）
      - name: 手动为共享项目创建资产文件（跳过还原）
        run: |
          ASSET_JSON='{"version":3,"targets":{"net10.0":{}},"libraries":{},"projectFileDependencyGroups":{"net10.0":[]},"packageFolders":{},"project":{"restore":{"projectUniqueName":"dummy.csproj","projectName":"dummy","projectPath":"dummy.csproj","packagesPath":"/Users/runner/.nuget/packages/","outputPath":"obj/","projectStyle":"PackageReference","originalTargetFrameworks":["net10.0"]}}}'
          for proj in OpenUtau.Core OpenUtau.Plugin.Builtin OpenUtauMobile.Plugin.Renderers; do
            mkdir -p $proj/obj
            echo "$ASSET_JSON" > $proj/obj/project.assets.json
          done
          echo "✅ 共享项目的资产文件已创建"

      - name: 编译 iOS 主项目
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            --no-dependencies \
            --no-restore \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:TargetFrameworks=net10.0-ios

      - name: 手动打包为 .ipa (兼容 TrollStore Lite)
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir Payload
          mv OpenUtauMobile.app Payload/
          zip -r OpenUtauMobile.ipa Payload/

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
