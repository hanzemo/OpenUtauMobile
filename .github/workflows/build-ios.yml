name: Build iOS App (Final Attempt)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      - name: 手动创建所有 project.assets.json 文件（包含正确目标）
        run: |
          # 为共享项目创建 net10.0 目标
          ASSET_JSON_NET10='{
            "version": 3,
            "targets": {
              "net10.0": {}
            },
            "libraries": {},
            "projectFileDependencyGroups": {
              "net10.0": []
            },
            "packageFolders": {},
            "project": {
              "restore": {
                "projectUniqueName": "dummy.csproj",
                "projectName": "dummy",
                "projectPath": "dummy.csproj",
                "packagesPath": "/Users/runner/.nuget/packages/",
                "outputPath": "obj/",
                "projectStyle": "PackageReference",
                "originalTargetFrameworks": ["net10.0"]
              }
            }
          }'

          # 为 iOS 主项目创建 net10.0-ios 目标
          ASSET_JSON_IOS='{
            "version": 3,
            "targets": {
              "net10.0-ios": {}
            },
            "libraries": {},
            "projectFileDependencyGroups": {
              "net10.0-ios": []
            },
            "packageFolders": {},
            "project": {
              "restore": {
                "projectUniqueName": "OpenUtauMobile.csproj",
                "projectName": "OpenUtauMobile",
                "projectPath": "OpenUtauMobile.csproj",
                "packagesPath": "/Users/runner/.nuget/packages/",
                "outputPath": "obj/",
                "projectStyle": "PackageReference",
                "originalTargetFrameworks": ["net10.0-ios"]
              }
            }
          }'

          # 共享项目使用 net10.0
          for proj in OpenUtau.Core OpenUtau.Plugin.Builtin OpenUtauMobile.Plugin.Renderers; do
            mkdir -p $proj/obj
            echo "$ASSET_JSON_NET10" > $proj/obj/project.assets.json
          done

          # 主项目使用 net10.0-ios
          mkdir -p OpenUtauMobile/obj
          echo "$ASSET_JSON_IOS" > OpenUtauMobile/obj/project.assets.json

          echo "✅ 所有 project.assets.json 文件已创建（含正确目标框架）"

      - name: 编译 iOS 主项目
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            --no-dependencies \
            --no-restore \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:TargetFrameworks=net10.0-ios \
            -p:DisableImplicitFrameworkReferences=true \
            -p:GenerateErrorForMissingTargetingPacks=false

      - name: 手动打包为 .ipa (兼容 TrollStore Lite)
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir Payload
          mv OpenUtauMobile.app Payload/
          zip -r OpenUtauMobile.ipa Payload/

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
