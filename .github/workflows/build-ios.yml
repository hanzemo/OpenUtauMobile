name: Build iOS App (Direct Publish)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      - name: 直接发布 iOS 应用（跳过所有中间步骤）
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:ArchiveOnBuild=false \
            -p:TargetFrameworks=net10.0-ios

      - name: 查找并打包生成的 .app 文件
        run: |
          APP_PATH=$(find . -name "*.app" -path "*/net10.0-ios/*" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          echo "Found .app at: $APP_PATH"
          cd $(dirname "$APP_PATH")
          mkdir Payload
          mv $(basename "$APP_PATH") Payload/
          zip -r OpenUtauMobile.ipa Payload/

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ipa
          path: OpenUtauMobile/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa
