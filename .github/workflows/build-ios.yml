name: Build iOS App (TrollStore Lite Compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      # 使用 msbuild -t:Restore 替代 dotnet restore
      - name: 还原所有项目（使用 msbuild）
        run: |
          msbuild -t:Restore OpenUtau.Core/OpenUtau.Core.csproj -p:TargetFrameworks=net10.0
          msbuild -t:Restore OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj -p:TargetFrameworks=net10.0
          msbuild -t:Restore OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj -p:TargetFrameworks=net10.0
          msbuild -t:Restore OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj -p:TargetFrameworks=net10.0-ios -p:RuntimeIdentifier=ios-arm64
          msbuild -t:Restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFrameworks=net10.0-ios -p:RuntimeIdentifier=ios-arm64

      - name: 编译生成未签名的 .app 包
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:TargetFrameworks=net10.0-ios

      - name: 手动打包为 .ipa (兼容 TrollStore Lite)
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir Payload
          mv OpenUtauMobile.app Payload/
          zip -r OpenUtauMobile.ipa Payload/

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
