name: Build iOS App (Copy Asset Target)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      # 还原所有项目
      - name: 还原所有项目
        run: |
          echo "📦 还原共享项目..."
          dotnet restore OpenUtau.Core/OpenUtau.Core.csproj -p:TargetFrameworks=net10.0 --force
          dotnet restore OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj -p:TargetFrameworks=net10.0 --force
          dotnet restore OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj -p:TargetFrameworks=net10.0 --force
          
          echo "📦 还原主项目..."
          dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFrameworks=net10.0-ios --runtime ios-arm64 --force

      # 从主项目复制 net10.0-ios 目标，修改为 net10.0
      - name: 复制并修改资产文件目标
        run: |
          # 检查主项目的资产文件是否存在
          if [ ! -f "OpenUtauMobile/obj/project.assets.json" ]; then
            echo "❌ 主项目资产文件不存在！"
            exit 1
          fi

          echo "📋 从主项目复制目标结构..."

          # 使用 Python 从主项目复制 target 并修改
          python3 << 'EOF'
          import json
          import os

          # 读取主项目的资产文件
          with open('OpenUtauMobile/obj/project.assets.json', 'r') as f:
              main_data = json.load(f)

          # 获取 net10.0-ios 目标
          ios_target = main_data['targets'].get('net10.0-ios', {})
          if not ios_target:
              print("❌ 主项目中没有 net10.0-ios 目标")
              exit(1)

          # 处理每个共享项目
          for proj in ['OpenUtau.Core', 'OpenUtau.Plugin.Builtin', 'OpenUtauMobile.Plugin.Renderers']:
              asset_file = f'{proj}/obj/project.assets.json'
              if not os.path.exists(asset_file):
                  print(f"⚠️ {asset_file} 不存在，跳过")
                  continue

              with open(asset_file, 'r') as f:
                  data = json.load(f)

              # 检查是否有 net10.0 目标
              if 'net10.0' in data.get('targets', {}):
                  print(f"✅ {proj} 已有 net10.0 目标，跳过")
                  continue

              # 复制目标结构（只复制框架，不复制具体的包依赖）
              # 由于共享项目可能依赖不同的包，我们只添加空的 target
              # 但保留完整的结构
              data['targets']['net10.0'] = {}

              # 复制 project 部分
              if 'project' not in data:
                  data['project'] = {}
              data['project']['restore'] = {
                  'projectUniqueName': f'{proj}.csproj',
                  'projectName': proj,
                  'projectPath': f'{proj}.csproj',
                  'packagesPath': '/Users/runner/.nuget/packages/',
                  'outputPath': 'obj/',
                  'projectStyle': 'PackageReference',
                  'originalTargetFrameworks': ['net10.0']
              }

              # 确保 projectFileDependencyGroups 包含 net10.0
              if 'projectFileDependencyGroups' not in data:
                  data['projectFileDependencyGroups'] = {}
              if 'net10.0' not in data['projectFileDependencyGroups']:
                  data['projectFileDependencyGroups']['net10.0'] = []

              # 确保 packageFolders 存在
              if 'packageFolders' not in data:
                  data['packageFolders'] = {
                      '/Users/runner/.nuget/packages/': {}
                  }

              # 写回文件
              with open(asset_file, 'w') as f:
                  json.dump(data, f, indent=2)

              print(f"✅ 已为 {proj} 添加 net10.0 目标")

          EOF

      # 验证资产文件
      - name: 验证资产文件
        run: |
          echo "📋 验证所有项目的资产文件..."
          for proj in OpenUtau.Core OpenUtau.Plugin.Builtin OpenUtauMobile.Plugin.Renderers OpenUtauMobile; do
            if [ -f "$proj/obj/project.assets.json" ]; then
              echo "  ✅ $proj/obj/project.assets.json 存在"
              if grep -q '"net10.0"' "$proj/obj/project.assets.json"; then
                echo "    ✅ 包含 net10.0 目标"
              else
                echo "    ❌ 不包含 net10.0 目标"
              fi
            else
              echo "  ❌ $proj/obj/project.assets.json 不存在"
            fi
          done

      - name: 编译共享项目
        run: |
          dotnet build OpenUtau.Core/OpenUtau.Core.csproj -f net10.0 -c Debug --no-restore
          dotnet build OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj -f net10.0 -c Debug --no-restore
          dotnet build OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj -f net10.0 -c Debug --no-restore

      - name: 编译 iOS 主项目
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:TargetFrameworks=net10.0-ios

      - name: 手动打包为 .ipa (兼容 TrollStore Lite)
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir Payload
          mv OpenUtauMobile.app Payload/
          zip -r OpenUtauMobile.ipa Payload/

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
