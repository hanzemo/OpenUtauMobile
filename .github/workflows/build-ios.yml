name: Build iOS App (Final Attempt)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      - name: 创建所有项目的资产文件（含运行时目标）
        run: |
          python3 << 'EOF'
          import json
          import os

          # 共享项目的资产文件（net10.0）
          shared_asset = {
              "version": 3,
              "targets": {
                  "net10.0": {}
              },
              "libraries": {},
              "projectFileDependencyGroups": {
                  "net10.0": []
              },
              "packageFolders": {
                  "/Users/runner/.nuget/packages/": {}
              },
              "project": {
                  "restore": {
                      "projectUniqueName": "dummy.csproj",
                      "projectName": "dummy",
                      "projectPath": "dummy.csproj",
                      "packagesPath": "/Users/runner/.nuget/packages/",
                      "outputPath": "obj/",
                      "projectStyle": "PackageReference",
                      "originalTargetFrameworks": ["net10.0"]
                  }
              }
          }

          # 主项目的资产文件（net10.0-ios/ios-arm64）
          main_asset = {
              "version": 3,
              "targets": {
                  "net10.0-ios/ios-arm64": {}
              },
              "libraries": {},
              "projectFileDependencyGroups": {
                  "net10.0-ios": []
              },
              "packageFolders": {
                  "/Users/runner/.nuget/packages/": {}
              },
              "project": {
                  "restore": {
                      "projectUniqueName": "OpenUtauMobile.csproj",
                      "projectName": "OpenUtauMobile",
                      "projectPath": "OpenUtauMobile.csproj",
                      "packagesPath": "/Users/runner/.nuget/packages/",
                      "outputPath": "obj/",
                      "projectStyle": "PackageReference",
                      "originalTargetFrameworks": ["net10.0-ios"],
                      "originalRuntimeIdentifiers": ["ios-arm64"]
                  }
              }
          }

          # 创建共享项目的资产文件
          for proj in ["OpenUtau.Core", "OpenUtau.Plugin.Builtin", "OpenUtauMobile.Plugin.Renderers"]:
              os.makedirs(f"{proj}/obj", exist_ok=True)
              with open(f"{proj}/obj/project.assets.json", "w") as f:
                  json.dump(shared_asset, f, indent=2)
              print(f"✅ 创建 {proj}/obj/project.assets.json")

          # 创建主项目的资产文件
          os.makedirs("OpenUtauMobile/obj", exist_ok=True)
          with open("OpenUtauMobile/obj/project.assets.json", "w") as f:
              json.dump(main_asset, f, indent=2)
          print("✅ 创建 OpenUtauMobile/obj/project.assets.json (包含 net10.0-ios/ios-arm64)")
          EOF

      - name: 编译 iOS 主项目
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            --no-dependencies \
            --no-restore \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:TargetFrameworks=net10.0-ios \
            -p:DisableImplicitFrameworkReferences=true \
            -p:GenerateErrorForMissingTargetingPacks=false

      - name: 打包 .ipa（如果编译成功）
        if: success()
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir -p Payload
          mv OpenUtauMobile.app Payload/ 2>/dev/null || echo "未找到 .app 文件"
          zip -r OpenUtauMobile.ipa Payload/ 2>/dev/null || echo "打包失败"
          ls -la

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
