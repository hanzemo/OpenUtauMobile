name: Build iOS App (Fix All Asset Targets)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      - name: 还原所有项目
        run: |
          echo "📦 还原共享项目..."
          dotnet restore OpenUtau.Core/OpenUtau.Core.csproj -p:TargetFrameworks=net10.0
          dotnet restore OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj -p:TargetFrameworks=net10.0
          dotnet restore OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj -p:TargetFrameworks=net10.0
          
          echo "📦 还原主项目..."
          dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFrameworks=net10.0-ios --runtime ios-arm64

      - name: 检查并修复资产文件中的目标框架
        run: |
          # 定义需要检查的项目列表
          PROJECTS="OpenUtau.Core:net10.0 OpenUtau.Plugin.Builtin:net10.0 OpenUtauMobile.Plugin.Renderers:net10.0 OpenUtauMobile:net10.0-ios"
          
          for entry in $PROJECTS; do
            proj="${entry%:*}"
            target="${entry#*:}"
            ASSET_FILE="$proj/obj/project.assets.json"
            
            if [ ! -f "$ASSET_FILE" ]; then
              echo "⚠️ $ASSET_FILE 不存在，跳过"
              continue
            fi
            
            echo "🔍 检查 $ASSET_FILE (目标: $target)..."
            
            # 使用 Python 检查并添加目标
            python3 -c "
          import json
          import sys

          asset_file = '$ASSET_FILE'
          target = '$target'
          
          try:
              with open(asset_file, 'r') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'  ❌ 读取文件失败: {e}')
              sys.exit(1)

          if target not in data.get('targets', {}):
              print(f'  ❌ {target} 目标不存在，正在添加...')
              data['targets'][target] = {}
              
              if 'projectFileDependencyGroups' not in data:
                  data['projectFileDependencyGroups'] = {}
              if target not in data['projectFileDependencyGroups']:
                  data['projectFileDependencyGroups'][target] = []
              
              with open(asset_file, 'w') as f:
                  json.dump(data, f, indent=2)
              print(f'  ✅ 已添加 {target} 目标到 {asset_file}')
          else:
              print(f'  ✅ {target} 目标已存在')
          "
          done

      - name: 编译共享项目
        run: |
          dotnet build OpenUtau.Core/OpenUtau.Core.csproj -f net10.0 -c Debug --no-restore
          dotnet build OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj -f net10.0 -c Debug --no-restore
          dotnet build OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj -f net10.0 -c Debug --no-restore

      - name: 编译 iOS 主项目
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:TargetFrameworks=net10.0-ios

      - name: 手动打包为 .ipa (兼容 TrollStore Lite)
        run: |
          cd OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/
          mkdir Payload
          mv OpenUtauMobile.app Payload/
          zip -r OpenUtauMobile.ipa Payload/

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/OpenUtauMobile.ipa
